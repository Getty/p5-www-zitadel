apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: default-gateway-cert
  namespace: kube-system
spec:
  secretName: default-gateway-cert
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-issuer
  commonName: "*.example.com"
  dnsNames:
    - "*.example.com"
    - "example.com"
